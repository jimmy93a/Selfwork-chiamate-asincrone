<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Selfwork chiamate asincrone</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1 class="text-center mt-2">Selfwork chiamate asincrone</h1>
    
    <section class="container mt-5">
        <div class="row justify-content-center">
            <div class="input-group mb-3 col-6 input-custom">
                <input type="number" class="form-control" placeholder="Secondi" aria-label="Username" aria-describedby="basic-addon1" id="inputSeconds">
            </div>
        </div>

        <div class="row justify-content-center text-center mt-5">
            <div class="col-12">
                <i class="fa-solid fa-play fa-3x" id="playButton"></i>
                <i class="fa-solid fa-pause fa-3x" id="pauseButton"></i>
                <i class="fa-solid fa-stop fa-3x" id="stopButton"></i>
            </div>
        </div>

        <div class="row justify-content-center mt-5 align-items-center">

            <div class="col-12 col-md-4 ">
                <p id="timerDisplay" class="text-center card-custom brd"></p>
            </div>

        </div>

    </section>
    
    
    <script src="https://kit.fontawesome.com/e4cb2a72fc.js" crossorigin="anonymous"></script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    
    <script src="main.js"></script>
</body>
</html>
